services:
  tgee-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tgee-procurement-api
    ports:
      - "8000:8000"
    environment:
      MODEL_BUNDLE_PATH: /app/artifacts/fy2025_2026/tgee_fy2025_2026_model_bundle.joblib
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      - ./artifacts/fy2025_2026:/app/artifacts/fy2025_2026:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
